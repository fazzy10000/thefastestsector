<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="IndyCar quiz cover">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10243d"/>
      <stop offset="55%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#08111d"/>
    </linearGradient>
    <pattern id="stripes" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <rect width="32" height="64" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#stripes)"/>
  <ellipse cx="920" cy="560" rx="260" ry="90" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="12"/>
  <ellipse cx="920" cy="560" rx="180" ry="62" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8"/>
  <path d="M120 260 C280 180, 420 320, 580 240 S860 180, 1080 120" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>
  <text x="72" y="120" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="6">INDYCAR</text>
  <text x="72" y="170" fill="#ffffff" fill-opacity="0.72" font-family="Arial, Helvetica, sans-serif" font-size="22">Quick fire quiz</text>
</svg>
